name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mirror has no lockfile: it is a snapshot of the packages, not of the workspace.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The wrapper is not committed; this installs the Gradle version it names.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle :splithub-core:test :splithub:assembleRelease :splithub-compose:assembleRelease
        working-directory: sdks/android
